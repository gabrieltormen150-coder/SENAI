<!DOCTYPE html>
<head>
    <title>Página SENAI - gabriel</title>
  <style>
body { font-family: sans-serif;
background: #f0f2f5;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
}
.card{
  background:#fff;
  padding: 30px;
  border-radius: 12px;
  border-shadow: 0 4px 15px rgba(0,0,0.1);
  text-align: center;
  max-width: 350px;
  width: 100%;
}
h1 {
  color: #666;
  margin-bottom: 10px;
}
p{
  color: #666;
  front-size: 14px;
}
.contador {
  front-size: 48px;
  front-weight: bold;
  color: #007bff;
  margin: 20px;
}
button {
background: #007bff;
color: #fff;
border: none;
padding: 12px 24px;
front-size: 16px;
border-radius: 6px;
cursor: pointer;
}
button:houver { background: #0056b3; } 
    </style>  
</head>
<body>

    
    <div class="card">
        <h1>SENAI</h1> 
        <p>Página simples combinando HTML, CSS e JavaScript.</p> 
        <div class="contador" id="numero-contador">0</div> 
        <button id="botao-clique">Clique Aqui!</button> 
    </div> 
    <script>
        
        const btn = document.getElementById('botao-clique');
        
        
        const num = document.getElementById('numero-contador');
         let c = 0;
        
        btn.addEventListener('click', () => num.textContent = ++c);
    </script>

</body>
</html>
